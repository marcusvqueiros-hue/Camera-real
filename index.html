<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Câmera Real</title>
<meta name="description" content="Fotos com data, hora e localização gravadas na imagem, salvas na nuvem e funcionando offline.">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Câmera Real">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="net" class="net" hidden></div>

<!-- Login -->
<section id="login" class="screen" hidden>
  <div class="card">
    <img src="icon.svg" alt="" width="64" height="64">
    <h1>Câmera Real</h1>
    <p class="muted">Entre uma vez com internet. Depois o app funciona mesmo sem sinal.</p>
    <form id="loginForm">
      <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
      <label>Senha<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" class="primary" id="btnLogin">Entrar</button>
      <button type="button" class="ghost" id="btnSignup">Criar conta</button>
    </form>
    <p id="loginMsg" class="msg" role="status"></p>
  </div>
</section>

<!-- Câmera -->
<section id="camera" class="screen" hidden>
  <div class="viewfinder">
    <video id="video" playsinline muted autoplay></video>
    <div id="camFallback" class="fallback" hidden>
      <p>Não foi possível abrir a câmera ao vivo.</p>
      <label class="primary filebtn">Tirar foto<input id="fileInput" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <div class="overlay">
      <div id="liveClock" class="stamp-preview"></div>
      <div id="liveGps" class="stamp-preview small"></div>
    </div>
    <div id="flash" class="flash"></div>
  </div>
  <div class="controls">
    <button id="btnGallery" class="round" aria-label="Galeria">
      <img id="lastThumb" alt="" hidden>
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 2v8.6l3.5-3.5 3 3 4-4 3.5 3.5V7H5Zm4 2.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
      <span id="pendingBadge" class="badge" hidden></span>
    </button>
    <button id="btnShutter" class="shutter" aria-label="Tirar foto"></button>
    <button id="btnFlip" class="round" aria-label="Trocar câmera">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M9 4h6l1.5 2H20a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3.5L9 4Zm3 4a5 5 0 0 0-4.6 3H6l2.5 3L11 11H9.6A3 3 0 0 1 15 12h2a5 5 0 0 0-5-4Zm4.5 2L14 13h1.4A3 3 0 0 1 9 12H7a5 5 0 0 0 9.6 1H18l-1.5-3Z"/></svg>
    </button>
  </div>
</section>

<!-- Galeria -->
<section id="gallery" class="screen page" hidden>
  <header class="bar">
    <button id="btnBack" class="link">‹ Câmera</button>
    <h2>Galeria</h2>
    <button id="btnSync" class="link">Sincronizar</button>
  </header>
  <p id="syncInfo" class="muted center"></p>
  <div id="grid" class="grid"></div>
  <p id="emptyMsg" class="muted center" hidden>Nenhuma foto ainda.</p>
  <footer class="foot">
    <span id="userEmail" class="muted"></span>
    <button id="btnLogout" class="link">Sair</button>
  </footer>
</section>

<!-- Foto aberta -->
<section id="viewer" class="screen viewer" hidden>
  <header class="bar">
    <button id="btnCloseViewer" class="link">‹ Galeria</button>
    <span></span>
    <button id="btnDelete" class="link danger">Apagar</button>
  </header>
  <img id="viewerImg" alt="Foto">
  <div class="meta" id="viewerMeta"></div>
  <div class="actions">
    <button id="btnDownload" class="primary">Baixar foto</button>
    <a id="btnMap" class="ghost" target="_blank" rel="noopener">Ver no mapa</a>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
